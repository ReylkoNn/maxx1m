name: Build Max1m Windows Desktop (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

jobs:
  build-windows:
    name: Windows x64 Portable (Max1m.exe)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install desktop dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r max1m_desktop/requirements.txt pyinstaller==6.11.1

      - name: Run desktop automated test suite
        working-directory: max1m_desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest cryptography
          pytest -q

      - name: Build Max1m.exe portable archive
        run: |
          python packaging/build_portable.py

      - name: Upload Max1m-Windows-x64.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max1m-Windows-x64
          path: packaging/dist/Max1m-Windows-x64.zip
          retention-days: 30
